# NVIDIA GPU / Jetson 图形直通覆盖文件（可选）
#
# 用法二选一：
#   A. 显式指定：
#      docker compose -f compose.yaml -f compose.nvidia.yaml up -d --build
#   B. 在 my-slam/.env 里写：
#      COMPOSE_FILE=compose.yaml:compose.nvidia.yaml
#      （之后 ./scripts/start.sh、./scripts/stop.sh 会自动带上这个覆盖文件）
#
# 为什么用 CDI 而不是 `runtime: nvidia` / `--gpus all`：
#   * 本机 (aarch64 GB10) 已安装 nvidia-container-toolkit，CDI spec 位于
#     /var/run/cdi/nvidia.yaml，但 /etc/docker/daemon.json 未注册 nvidia
#     runtime，所以 `runtime: nvidia` 会直接启动失败。
#   * `devices: [nvidia.com/gpu=all]` 由 Docker Engine 直接解析 CDI，会把
#     /dev/nvidia*、/dev/dri 以及 CUDA/OpenGL 用户态库注入容器。
#
# 前提条件（宿主机）：
#   1. /var/run/cdi/nvidia.yaml 存在（`nvidia-ctk cdi generate` 生成）
#   2. 用 ./scripts/gpu-check.sh 验证
# 若宿主机没有 GPU 直通能力，请不要使用本文件，
# 保持 LIBGL_ALWAYS_SOFTWARE=1 走 llvmpipe 软件渲染。
services:
  slam-ros2-dev:
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-all}
      # 有真实 GPU 时不要再强制软件渲染
      LIBGL_ALWAYS_SOFTWARE: "0"
      __GLX_VENDOR_LIBRARY_NAME: nvidia
    devices:
      - nvidia.com/gpu=all
    # /dev/dri/renderD128 在宿主机上属于 gid 993，容器内没有同名组；
    # 不补充这个组，EGL/GBM 打不开渲染节点，仍然会退回软件渲染。
    group_add:
      - video
      - ${RENDER_GID:-993}
