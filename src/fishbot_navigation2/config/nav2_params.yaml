amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    #
    # 【重要】原书在这里把 Nav2 的全部内置 BT 节点逐个列了出来。Jazzy 里这些内置
    # 节点是自动注册的（官方默认文件的原话：“Built-in plugins are added
    # automatically”），再手动列一遍就会重复注册，报：
    #   bt_navigator: Failed to create navigator id navigate_to_pose.
    #   Exception: ID [ComputePathToPose] already registered
    # 并导致整个 component_container 段错误退出，lifecycle 全体卡住。
    # 所以这里必须整行注释掉——注意不能写成 `plugin_lib_names: []`，
    # launch 在归一化参数时会把空列表变成空元组并抛异常：
    #   Expected 'value' to be one of [float, int, str, bool, bytes], but got '()'
    # 官方默认文件同样是把这一行注释掉的。
    # plugin_lib_names: []

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    # 本仓库的 fishbot_diff_drive_controller (ros2_controllers 4.x / Jazzy) 只接受
    # TwistStamped，而 Nav2 默认发 Twist。打开此项后 Nav2 改发 TwistStamped，
    # 否则 /cmd_vel 类型不匹配，车不会动。（对应旧版 Humble 的 use_stamped_vel）
    enable_stamped_cmd_vel: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    # 原书是单数 progress_checker_plugin（Humble 写法），Jazzy 官方默认是复数。
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # DWB parameters
    FollowPath:
      # ---------------------------------------------------------------
      # 原始实现把控制器换成了自研插件。本仓库默认**仍用 DWB**，
      # 以免影响已验证的巡逻/导航行为。想体验自研控制器，把下面那行
      # plugin 换成：
      #
      #   plugin: "nav2_custom_controller::CustomController"
      #   max_linear_speed: 0.1
      #   max_angular_speed: 1.0
      #
      # 已实测（详见 README 的「自定义规划器 / 控制器插件」一节）：
      #   controller_server 打印 “Created controller : FollowPath of type
      #   nav2_custom_controller::CustomController”；
      #   目标 (2.60,0.90) -> 真值终点 (2.580,0.974)，误差 0.077 m，SUCCEEDED。
      # 注意：它只是朝目标直行，不做避障，限速也只有 0.1 m/s。
      # ---------------------------------------------------------------
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.26
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      # 原书为 Humble 写法 nav2_navfn_planner/NavfnPlanner，Jazzy 里必须用 ::，
      # 否则 planner_server 启动即 FATAL："class ... does not exist"。
      #
      # 想换成自研规划器（示例插件），把下面那行 plugin 换成：
      #
      #   plugin: "nav2_custom_planner::CustomPlanner"
      #   interpolation_resolution: 0.1
      #
      # 已实测：planner_server 打印 “Created global planner plugin GridBased of
      # type nav2_custom_planner::CustomPlanner”，能正常出路径。
      # 注意：它是在起终点之间做**直线插值**，不会绕障（只会在撞到致命障碍时
      # 报错），所以只适合空旷环境。
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    # 同样：原书 nav2_behaviors/Xxx 是 Humble 写法，Jazzy 需要 nav2_behaviors::Xxx
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    # spin / backup / drive_on_heading 等恢复动作也会往 /cmd_vel 发速度，
    # 同样必须是 TwistStamped，否则卡住时无法脱困。
    enable_stamped_cmd_vel: True
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    # bringup 会把 velocity_smoother 串在 /cmd_vel 前面：
    #   cmd_vel -> cmd_vel_nav（输入）,  cmd_vel_smoothed -> cmd_vel（输出）
    # 所以它也是 /cmd_vel 的实际发布者，同样要发 TwistStamped。
    enable_stamped_cmd_vel: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ---------------------------------------------------------------------------
# collision_monitor：Jazzy 的 navigation_launch.py 会无条件启动这个节点（Humble
# 没有），而原书 nav2_params.yaml 里没有它的配置段，导致 lifecycle 配置失败：
#   "parameter 'observation_sources' is not initialized"
# 下面这段取自 Jazzy 官方默认 nav2_params.yaml，另加 enable_stamped_cmd_vel。
#
# 注意它在速度链里的位置：它是 /cmd_vel 的最终发布者
#   controller_server/behavior_server -> cmd_vel_nav
#     -> velocity_smoother -> cmd_vel_smoothed
#       -> collision_monitor -> cmd_vel（机器人实际收）
# ---------------------------------------------------------------------------
collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    enable_stamped_cmd_vel: True
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

# ---------------------------------------------------------------------------
# docking_server：同样是 Jazzy 新启动、原书参数文件里没有的节点。它不配置参数
# 也能过 on_configure，但在激活时会去建 cmd_vel 发布者，类型是 Twist，于是和
# 上面已经声明为 TwistStamped 的 cmd_vel 冲突：
#   could not create publisher: create_publisher() called for existing topic name
#   rt/cmd_vel with incompatible type geometry_msgs::msg::dds_::Twist_
#   -> Lifecycle node docking_server does not have error state implemented
#   -> Failed to bring up all requested nodes. Aborting bringup.
# 它同样支持 enable_stamped_cmd_vel（libopennav_docking_core.so 里有该参数）。
# 本项目不做自动充电坞对接，其余参数留默认值即可。
# ---------------------------------------------------------------------------
docking_server:
  ros__parameters:
    use_sim_time: True
    enable_stamped_cmd_vel: True
    # 还必须给插件，否则激活时报 "Charging dock plugins not given!"。
    # 下面取自 Jazzy 官方默认 nav2_params.yaml。本项目不做自动充电坞对接，
    # 这里只是为了让它能正常激活、不影响 lifecycle 链。
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
